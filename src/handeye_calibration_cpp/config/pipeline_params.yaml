auto_calibration_node:
  ros__parameters:

    num_samples: 500
    output_dir: /home/cyb/projects/handeye_ws/src/handeye_calibration_cpp/data
    calibration_method: DANIILIDIS

    # move_to_next_point now lives in motor_bridge itself, which owns the
    # Feetech bus -- no trajectory-controller round trip. run_points_node
    # below is the older path and is no longer reached from here.
    point_sampler_node: /so101_motor_bridge

    # capture_node's own ~/sample_position (image + TF into dataset.yaml).
    # Note motor_bridge also has a ~/sample_position; that one is the
    # interactive reposition-by-hand helper and is not what belongs here.
    capture_node: /capture_node

calibration_node:
  ros__parameters:
    # Frames named in handeye_result.yaml (gripper -> camera).
    parent_frame: openarm_right_hand
    child_frame: webcam_optical_frame

run_points_node:
  ros__parameters:
    recorded_points_path: /home/cyb/projects/handeye_ws/src/record_positions/data/manifest.yaml
    commands_topic: /right_joint_trajectory_controller/joint_trajectory
    joint_state_topic: /joint_states

capture_node:
  ros__parameters:
    base_frame: openarm_right_link0
    gripper_frame: openarm_right_hand

    # Webcam via usb_cam (see webcam.launch.py).
    # Orbbec equivalents were /camera/color/image_raw and /camera/color/camera_info.
    image_topic: /webcam/image_raw
    camera_info_topic: /webcam/camera_info

    squares_x: 8
    squares_y: 10
    square_length_m: 0.015
    marker_length_m: 0.011
    dictionary: 4X4_50
    legacy_pattern: false
    min_charuco_corners: 6


intrinsics_node:
  ros__parameters:
    image_topic: /webcam/image_raw
    camera_name: webcam

    # Read back by usb_cam through camera_info_url in webcam_params.yaml.
    output_path: /home/cyb/projects/handeye_ws/src/handeye_calibration_cpp/config/webcam_intrinsics.yaml

    min_views: 15

    # Annotated frames: view_NNN.png at capture time (detected markers and
    # ChArUco corners), and view_NNN_reproj.png after ~/calibrate showing
    # detected corners as green rings against reprojected points as red dots.
    # Set to "" to switch off.
    debug_dir: /home/cyb/projects/handeye_ws/src/handeye_calibration_cpp/data/intrinsics_debug

    # Must match capture_node's board block above -- the same printed board is
    # used for intrinsics and for the hand-eye poses.
    squares_x: 8
    squares_y: 10
    square_length_m: 0.015
    marker_length_m: 0.011
    dictionary: 4X4_50
    legacy_pattern: false
    min_charuco_corners: 6
